<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 2300 1320" preserveAspectRatio="xMinYMin meet" role="img" aria-labelledby="title desc">
  <title id="title">CIM database entity relationship diagram</title>
  <desc id="desc">Entity relationship diagram for the active SQLAlchemy models in backend/database/models.py.</desc>
  <defs>
    <linearGradient id="canvasGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef3f8"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#243b53" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606d"/>
    </marker>
    <style>
      .canvas { fill: url(#canvasGradient); }
      .title { font: 700 28px Arial, sans-serif; fill: #172b4d; }
      .subtitle { font: 14px Arial, sans-serif; fill: #52606d; }
      .entity { fill: #ffffff; stroke: #c5d0dc; stroke-width: 1.5; rx: 10; filter: url(#cardShadow); }
      .entity-header { fill: #2b6f9f; }
      .entity-header.core { fill: #1d557d; }
      .entity-header.support { fill: #37856c; }
      .entity-header.audit { fill: #8d673a; }
      .entity-name { font: 700 17px Arial, sans-serif; fill: #ffffff; }
      .field { font: 13px Consolas, 'Courier New', monospace; fill: #263238; }
      .field.pk { font-weight: 700; fill: #8b4513; }
      .field.fk { fill: #175c8a; }
      .field.json { fill: #6a3d8f; }
      .field-note { font: 11px Arial, sans-serif; fill: #6b778c; }
      .json-card { fill: #fcf8ff; stroke: #b99ad0; stroke-width: 1.5; rx: 10; filter: url(#cardShadow); }
      .json-header { fill: #6a3d8f; }
      .json-title { font: 700 15px Arial, sans-serif; fill: #ffffff; }
      .json-field { font: 11px Consolas, 'Courier New', monospace; fill: #4d286b; }
      .json-note { font: 11px Arial, sans-serif; fill: #6b4a7d; }
      .edge { fill: none; stroke: #8996a5; stroke-width: 1.5; marker-end: url(#arrow); }
      .edge-label { font: 12px Arial, sans-serif; font-weight: 600; fill: #40566b; paint-order: stroke; stroke: #ffffff; stroke-width: 6px; stroke-linejoin: round; }
      .legend { font: 12px Arial, sans-serif; fill: #52606d; }
    </style>
  </defs>

  <rect class="canvas" width="2300" height="1320"/>
  <text class="title" x="40" y="42">CIM Database ER Diagram</text>
  <text class="subtitle" x="40" y="68">Active SQLAlchemy schema from backend/database/models.py • PK = primary key • FK = foreign key</text>

  <path class="edge" d="M310 200 C380 200 430 200 500 200"/>

  <path class="edge" d="M175 340 C175 350 175 355 175 365"/>

  <path class="edge" d="M860 220 C940 220 970 220 1050 220"/>

  <path class="edge" d="M680 670 L680 850 L1000 850 L1000 700 L1050 700"/>

  <path class="edge" d="M860 150 L900 150 L900 60 L1500 60 L1500 150 L1550 150"/>

  <path class="edge" d="M860 400 L950 400 L950 450 L1500 450 L1550 450"/>

  <path class="edge" d="M860 500 L900 500 L900 950 L1500 950 L1500 780 L1550 780"/>

  <path class="edge" d="M310 450 L430 450 L430 850 L1000 850 L1000 300 L1050 300"/>

  <g transform="translate(40 95)">
    <rect class="entity" width="270" height="245"/>
    <rect class="entity-header core" width="270" height="38" rx="8"/>
    <rect class="entity-header core" y="30" width="270" height="8"/>
    <text class="entity-name" x="14" y="25">User</text>
    <text class="field pk" x="14" y="62">PK  id : String(36)</text>
    <text class="field" x="14" y="84">username : String(64) UNIQUE</text>
    <text class="field" x="14" y="106">email : String(255) UNIQUE</text>
    <text class="field" x="14" y="128">password_hash : String(255)</text>
    <text class="field" x="14" y="150">role : String(32)</text>
    <text class="field" x="14" y="172">is_active : Boolean</text>
    <text class="field" x="14" y="194">is_verified : Boolean</text>
    <text class="field" x="14" y="216">created_at / updated_at</text>
    <text class="field" x="14" y="238">last_login_at : DateTime?</text>
  </g>

  <g transform="translate(40 365)">
    <rect class="entity" width="270" height="190"/>
    <rect class="entity-header support" width="270" height="38" rx="8"/>
    <rect class="entity-header support" y="30" width="270" height="8"/>
    <text class="entity-name" x="14" y="25">Commander</text>
    <text class="field pk" x="14" y="62">PK  commander_id : String(36)</text>
    <text class="field" x="14" y="84">email : String(255) UNIQUE</text>
    <text class="field fk" x="14" y="106">FK  original_user_id : String(36)?</text>
    <text class="field" x="14" y="128">created_at : DateTime</text>
  </g>

  <g transform="translate(500 95)">
    <rect class="entity" width="360" height="575"/>
    <rect class="entity-header core" width="360" height="38" rx="8"/>
    <rect class="entity-header core" y="30" width="360" height="8"/>
    <text class="entity-name" x="14" y="25">IncidentMaster</text>
    <text class="field pk" x="14" y="62">PK  incident_id : String(36)</text>
    <text class="field fk" x="14" y="84">FK  user_id : String(36)</text>
    <text class="field" x="14" y="106">incident_number : String(50)</text>
    <text class="field" x="14" y="128">user_email : String(255) snapshot</text>
    <text class="field" x="14" y="150">subject : String(500)</text>
    <text class="field" x="14" y="172">category : String(100)</text>
    <text class="field" x="14" y="194">short_description : String(1000)</text>
    <text class="field" x="14" y="216">description : Text</text>
    <text class="field" x="14" y="238">zone : String(100)</text>
    <text class="field" x="14" y="260">service_name : String(200)</text>
    <text class="field" x="14" y="282">severity / status / source</text>
    <text class="field" x="14" y="313">intent : String(100)?</text>
    <text class="field" x="14" y="335">intent_confidence : Numeric(5,4)?</text>
    <text class="field" x="14" y="357">severity_prediction : String(20)?</text>
    <text class="field" x="14" y="379">severity_confidence : Numeric(5,4)?</text>
    <text class="field" x="14" y="401">business_impact / next_best_action</text>
    <text class="field" x="14" y="423">root_cause_hypothesis : Text?</text>
    <text class="field" x="14" y="445">risk_score / confidence_score</text>
    <text class="field" x="14" y="467">author_input_score</text>
    <text class="field" x="14" y="489">resolution_evaluation_score</text>
    <text class="field" x="14" y="511">recommendation_status</text>
    <text class="field json" x="14" y="533">JSON analysis_history : list[dict]</text>
  </g>

  <g transform="translate(1050 95)">
    <rect class="entity" width="330" height="250"/>
    <rect class="entity-header support" width="330" height="38" rx="8"/>
    <rect class="entity-header support" y="30" width="330" height="8"/>
    <text class="entity-name" x="14" y="25">IncidentCommander</text>
    <text class="field pk" x="14" y="62">PK  incident_commander_id</text>
    <text class="field fk" x="14" y="84">FK  incident_id : String(36)</text>
    <text class="field fk" x="14" y="106">FK  commander_id : String(36)</text>
    <text class="field" x="14" y="128">assignment_id : String(100) UNIQUE</text>
    <text class="field" x="14" y="150">assigned_at : DateTime</text>
    <text class="field" x="14" y="172">unassigned_at : DateTime?</text>
    <text class="field" x="14" y="194">is_primary : Boolean</text>
    <text class="field-note" x="14" y="220">One active primary per incident.</text>
  </g>

  <g transform="translate(1550 95)">
    <rect class="entity" width="330" height="245"/>
    <rect class="entity-header support" width="330" height="38" rx="8"/>
    <rect class="entity-header support" y="30" width="330" height="8"/>
    <text class="entity-name" x="14" y="25">WarRoom</text>
    <text class="field pk" x="14" y="62">PK  war_room_id : String(36)</text>
    <text class="field fk" x="14" y="84">FK  incident_id : String(36) UNIQUE</text>
    <text class="field" x="14" y="106">meeting_id : String(255)?</text>
    <text class="field" x="14" y="128">meeting_url : String(1000)?</text>
    <text class="field" x="14" y="150">status : String(50)</text>
    <text class="field" x="14" y="172">created_at / started_at</text>
    <text class="field" x="14" y="194">ended_at : DateTime?</text>
    <text class="field" x="14" y="216">blob paths: transcript / recording / logbook</text>
  </g>

  <g transform="translate(1550 380)">
    <rect class="entity" width="330" height="235"/>
    <rect class="entity-header audit" width="330" height="38" rx="8"/>
    <rect class="entity-header audit" y="30" width="330" height="8"/>
    <text class="entity-name" x="14" y="25">IncidentPerformanceMetric</text>
    <text class="field pk" x="14" y="62">PK  metric_id : String(36)</text>
    <text class="field fk" x="14" y="84">FK  incident_id : String(36) UNIQUE</text>
    <text class="field" x="14" y="106">detected_at / acknowledged_at</text>
    <text class="field" x="14" y="128">war_room_started_at</text>
    <text class="field" x="14" y="150">resolution_started_at / resolved_at</text>
    <text class="field" x="14" y="172">mttd_seconds / mtta_seconds</text>
    <text class="field" x="14" y="194">mttr_seconds : BigInteger?</text>
    <text class="field" x="14" y="216">created_at : DateTime</text>
  </g>

  <g transform="translate(1050 590)">
    <rect class="entity" width="330" height="220"/>
    <rect class="entity-header audit" width="330" height="38" rx="8"/>
    <rect class="entity-header audit" y="30" width="330" height="8"/>
    <text class="entity-name" x="14" y="25">AgentExecutionLog</text>
    <text class="field pk" x="14" y="62">PK  agent_execution_id</text>
    <text class="field fk" x="14" y="84">FK  incident_id : String(36)</text>
    <text class="field" x="14" y="106">agent_id : String(150)</text>
    <text class="field json" x="14" y="128">JSON execution_history : list[dict]</text>
    <text class="field" x="14" y="181">created_at / updated_at</text>
    <text class="field-note" x="14" y="203">UNIQUE(incident_id, agent_id)</text>
  </g>

  <g transform="translate(1550 675)">
    <rect class="entity" width="330" height="220"/>
    <rect class="entity-header support" width="330" height="38" rx="8"/>
    <rect class="entity-header support" y="30" width="330" height="8"/>
    <text class="entity-name" x="14" y="25">StakeholderReport</text>
    <text class="field pk" x="14" y="62">PK  report_id : String(36)</text>
    <text class="field fk" x="14" y="84">FK  incident_id : String(36)</text>
    <text class="field" x="14" y="106">meeting_id : String(255)?</text>
    <text class="field" x="14" y="128">report_type : String(50)</text>
    <text class="field" x="14" y="150">generated_at : DateTime</text>
    <text class="field" x="14" y="172">report_blob_path : String(1000)?</text>
    <text class="field" x="14" y="194">notification_status : String(50)</text>
  </g>

  <g transform="translate(1950 95)">
    <rect class="json-card" width="280" height="430"/>
    <rect class="json-header" width="280" height="36" rx="8"/>
    <rect class="json-header" y="28" width="280" height="8"/>
    <text class="json-title" x="12" y="24">analysis_history JSON</text>
    <text class="json-field" x="12" y="82">analysis_id, analyzed_at</text>
    <text class="json-field" x="12" y="100">intent, intent_confidence</text>
    <text class="json-field" x="12" y="118">severity_prediction, severity_confidence</text>
    <text class="json-field" x="12" y="136">business_impact, risk_score</text>
    <text class="json-field" x="12" y="154">next_best_action</text>
    <text class="json-field" x="12" y="172">root_cause_hypothesis</text>
    <text class="json-field" x="12" y="190">confidence_score</text>
    <text class="json-field" x="12" y="208">author_input_score</text>
    <text class="json-field" x="12" y="226">resolution_evaluation_score</text>
    <text class="json-field" x="12" y="244">recommendation_status</text>
  </g>

  <g transform="translate(1950 560)">
    <rect class="json-card" width="280" height="465"/>
    <rect class="json-header" width="280" height="36" rx="8"/>
    <rect class="json-header" y="28" width="280" height="8"/>
    <text class="json-title" x="12" y="24">execution_history JSON</text>
    <text class="json-field" x="12" y="82">attempt, model_name, model_type</text>
    <text class="json-field" x="12" y="100">fallback_level, fallback_used</text>
    <text class="json-field" x="12" y="118">success, execution_status</text>
    <text class="json-field" x="12" y="136">input_tokens, output_tokens</text>
    <text class="json-field" x="12" y="154">total_tokens, latency_ms</text>
    <text class="json-field" x="12" y="172">retry_count</text>
    <text class="json-field" x="12" y="190">confidence_score, evaluation_score</text>
    <text class="json-field" x="12" y="208">judge_score</text>
    <text class="json-field" x="12" y="226">reasoning_summary</text>
    <text class="json-field" x="12" y="244">error_message</text>
    <text class="json-field" x="12" y="262">started_at, completed_at</text>
  </g>

  <g aria-label="relationships">
    <text class="edge-label" x="320" y="80">User 1:N incidents</text>
    <text class="edge-label" x="190" y="355">User 1:N commanders</text>
    <text class="edge-label" x="890" y="205">Incident 1:N assignments</text>
    <text class="edge-label" x="700" y="880">Incident 1:N agent logs</text>
    <text class="edge-label" x="1390" y="365">Incident 1:1 war room</text>
    <text class="edge-label" x="1120" y="430">Incident 1:1 metric</text>
    <text class="edge-label" x="1390" y="640">Incident 1:N reports</text>
    <text class="edge-label" x="315" y="930">Commander 1:N assignments</text>
  </g>

  <g transform="translate(40 1190)">
    <text class="legend" x="0" y="0">Legend:</text>
    <text class="field pk" x="62" y="0">PK</text>
    <text class="legend" x="88" y="0">primary key</text>
    <text class="field fk" x="180" y="0">FK</text>
    <text class="legend" x="206" y="0">foreign key</text>
    <text class="field json" x="315" y="0">JSON</text>
    <text class="legend" x="365" y="0">structured list/object stored in SQLite JSON</text>
    <text class="legend" x="760" y="0">1:N one-to-many</text>
    <text class="legend" x="900" y="0">1:1 one-to-one</text>
  </g>
</svg>
